{{/*
Environment specific settings (ESB, alz-token-management, SBM), mounted as
application-<profile>.yml next to the common application.yml.
*/}}
{{- $profile := include "sbm-declaration-services.profile" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  labels:
    {{- include "sbm-declaration-services.labels" . | nindent 4 }}
data:
  application-{{ $profile }}.yml: |-
{{ .Files.Get (printf "configs/application-%s.yml" $profile) | indent 4 }}
