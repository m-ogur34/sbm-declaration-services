global:
  overrides:
    esb:
      # null = use the default in chart/configs/application-sc-uat.yml.
      # The legacy SOAP client pom notes that esb.allianz.com.tr has no DNS record and
      # gives 10.70.52.149 for UAT; set http://10.70.52.149:12000 here if the name fails.
      server: ~

springboot-deployment:
  gateway:
    migration:
      mode: istio
  app:
    env:
      # ALTERNATİF ESB adresi tanımı. global.overrides.esb.server -> ESB_SERVER
      # eşlemesini springboot-deployment subchart'ının yaptığı VARSAYILDI; sözleşmesi
      # doğrulanmadı (README "Açık Konular" #11). Varsayım tutmazsa yukarıdaki
      # global.overrides.esb.server yerine değişkeni burada doğrudan tanımla.
      # Anahtar adı subchart sözleşmesine göre custom / variables / extraEnv olabilir:
      # custom:
      #   - name: ESB_SERVER
      #     value: http://10.70.52.149:12000
      java:
        args: -Xms3g -Xmx3g -XX:+FlightRecorder
      springboot:
        profile: sc-uat
        sysType: SC-UAT
    resources:
      limits:
        cpu: '2'
        memory: 3Gi
      requests:
        cpu: '0.5'
        memory: 3Gi
    secretManager:
      vault:
        secret: kv/data/UAT
        template: |
          {{ with secret "kv/data/UAT/data-source/opusAgencyDataSource" -}}
            export SPRING_DATASOURCE_USERNAME="{{ .Data.data.username }}"
            export SPRING_DATASOURCE_PASSWORD="{{ .Data.data.password }}"
            export SPRING_DATASOURCE_URL="{{ .Data.data.url }}"
          {{- end }}
    autoscale:
      minReplicas: 1
      maxReplicas: 1
