{{/*
Placeholder Secret. Database credentials are NOT stored here: the Vault agent renders the
template declared in helm/values/<env>.yaml and exports
SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD,
which Spring Boot binds automatically.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "allianz.bundlename" . }}-secret
  labels:
    app: {{ include "allianz.bundlename" . }}
  annotations:
    allianz.com.tr/secret-source: vault
type: Opaque
data: {}
