# Settings shared by every environment. Anything that differs per environment lives in
# configs/application-<profile>.yml instead.
spring:
  datasource:
    # URL, username and password come from the Vault template as
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables.
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: sbm-declaration-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

esb:
  ysv:
    beyanname-path: /api/rest/vergi-beyan-rs/v10/ysv-beyanname
    sorgu-path: /api/rest/vergi-beyan-rs/v10/ysv-beyanname/sorgu
    sorgu-method: GET
  connect-timeout: 10s
  read-timeout: 60s

token-management:
  path: /alz-token-management/api/v1/tokens/sbm-token-generate
  client-name: ysv
  user-name: WDA2422_16178
  company-code: "045"
  connect-timeout: 5s
  read-timeout: 30s

sbm:
  company-code: "045"
  retry:
    max-attempts: 2          # only for SEC-00002 and 5xx

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO
