# Settings shared by every environment. Anything that differs per environment lives in
# configs/application-<profile>.yml instead.
spring:
  datasource:
    # URL, username and password come from the Vault template as
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables.
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: sbm-declaration-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

esb:
  ysv:
    # OSB Proxy Service endpoint URI (SC-UAT'ta doğrulandı). Tüm ortamlarda aynı;
    # host:port ESB_SERVER'dan gelir. Proxy SBM'nin gerçek adresine yönlendirir.
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

# token-management is deliberately absent here: every one of its settings - base-url, path,
# client-name, user-name, company-code - is environment specific and lives in
# configs/application-<profile>.yml. TokenManagementProperties is @Validated with @NotBlank,
# so a missing setting fails the application at startup instead of at the first SBM call.

sbm:
  company-code: "045"
  retry:
    max-attempts: 2          # only for SEC-00002 and 5xx

# PEN test savunma katmanı. api-key koda/git'e yazılmaz; ortam secret'ından
# API_GUARD_API_KEY olarak enjekte edilir. Boşsa anahtar kontrolü kapalı, rate limit açık.
api-guard:
  enabled: true
  api-key: ${API_GUARD_API_KEY:}
  rate-limit:
    enabled: true
    capacity: 120
    refill-tokens: 120
    refill-period: 1m

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO
