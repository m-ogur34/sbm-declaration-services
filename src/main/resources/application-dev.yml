# Local development profile. It targets the SC-UAT Oracle instance; no in-memory database
# is used anywhere, so the schema always matches production.
#
# DB credentials come from Vault (spring.cloud.vault below, default-context
# DEV/apps/sbm-declaration-services). The SPRING_DATASOURCE_* placeholders are kept as a
# fallback / k8s-environment path, where the Vault agent template exports them as env vars
# instead (see helm/values/<ortam>.yaml).
spring:
  config:
    import: vault://
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    show-sql: true
  cloud:
    vault:
      host: int-vault-local-test.allianz.com.tr
      port: 443
      scheme: https
      authentication: token
      enabled: true
      kv:
        backend: kv
        enabled: true
      default-context: DEV/apps/sbm-declaration-services
      application-name: DEV/apps/sbm-declaration-services

esb:
  # ESB_SERVER lets the address be overridden without touching the image; there is no DNS
  # record for esb.allianz.com.tr in every environment, so a plain IP may be needed
  # (e.g. http://10.70.52.149:12000 for UAT).
  base-url: ${ESB_SERVER:http://esb.allianz.com.tr:12000}
  ysv:
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

# Lokal geliştirme SC-TEST token servisini kullanır. Bunlar bilinen tek ortam değerleri;
# diğer ortamların parametreleri helm/chart/configs/application-<profil>.yml içindedir.
token-management:
  base-url: https://int-sc-test-auth.allianz.com.tr
  path: /alz-token-management/api/v1/tokens/sbm-token-generate
  client-name: ysv
  function-name: test
  user-name: WDA2422_16178
  company-code: "045"
  connect-timeout: 5s
  read-timeout: 30s

sbm:
  company-code: "045"
  retry:
    max-attempts: 2

logging:
  level:
    tr.com.allianz.ysv.services: DEBUG
